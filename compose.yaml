# Local stack: `make up`, then `make run`. Same realm, metrics and dashboard as the Java version.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders        # local demo only
    ports:
      - "5432:5432"

  keycloak:                            # OAuth 2.1 authorization server (demo realm)
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm --http-port=8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin   # local demo only
      KC_HOSTNAME: http://localhost:8180   # fixed issuer, also for tokens requested from inside the network (k6)
    volumes:
      - ./docker/keycloak/orders-realm.json:/opt/keycloak/data/import/orders-realm.json:ro
    ports:
      - "8180:8180"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin   # local demo only
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  k6:                                  # load test, on demand: `make loadtest` (needs `make run`)
    image: grafana/k6:2.3.0
    profiles: ["loadtest"]
    command: run --summary-export=/results/go.json /scripts/mcp-load-test.js
    environment:
      MCP_URL: http://host.docker.internal:8080/mcp          # server runs on the host
      MCP_HOST: localhost:8080                               # server rejects non-localhost Host headers
      TOKEN_URL: http://keycloak:8180/realms/orders/protocol/openid-connect/token
    volumes:
      - ./k6:/scripts:ro
      - ./k6/results:/results
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
